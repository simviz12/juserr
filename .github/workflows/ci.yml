name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vulnerabilidades críticas en dependencias de producción
        run: pnpm audit --prod --audit-level=critical
      - name: Informe de vulnerabilidades altas (no bloquea)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high
      - name: Formato y lint
        run: pnpm lint
      - name: Tipos
        run: pnpm check
      - name: Pruebas (aislamiento entre restaurantes, seguridad, integridad y migraciones)
        run: pnpm vitest run --coverage
      - name: Cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 14
      - name: Build
        run: pnpm build
      - name: Ninguna consulta de negocio sin filtro de restaurante
        run: |
          # Todo acceso a tablas de negocio debe pasar por delTenant()/tenantId.
          # Falla si aparece un db.update/db.delete sin filtro en rutas o servicios.
          if grep -rnE "db\s*\.\s*(update|delete)\([a-zA-Z]+\)\s*\.\s*(set\([^)]*\)\s*\.\s*)?where\(eq\([a-zA-Z]+\.id," src/routes src/lib/features src/lib/modules; then
            echo "Hay updates/deletes por id sin delTenant(). Revisa el aislamiento por restaurante." && exit 1
          fi
      - name: Sin secretos en el código
        run: |
          if git grep -nE "postgres(ql)?://[^ '\"$]+:[^ '\"$@]+@[a-z0-9.-]+.(neon.tech|amazonaws.com)|sk_live_[0-9a-zA-Z]{10,}|AKIA[0-9A-Z]{16}" -- ':!*.md'; then
            echo "Parece haber una credencial en el código. Muévela a variables de entorno." && exit 1
          fi
